name: AssetStudioBuild

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download, install and wire up FBX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          md fbx | Out-Null
          cd fbx

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          $p = Start-Process -FilePath ".\fbxsdk.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "FBX SDK installer exited with code $($p.ExitCode)"
          }

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          $p = Start-Process -FilePath ".\fbxpdb.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "FBX SDK pdb installer exited with code $($p.ExitCode)"
          }
          cd ..

          # AssetStudioFBXNative.vcxproj hardcodes an absolute FBX SDK path (this is how
          # upstream AssetStudio ships it - see its README: "modify the project file, change
          # include directory and library directory to point to the FBX SDK directory").
          # Rather than assume the checked-in version/layout matches what the installer above
          # actually produced, find fbxsdk.h and libfbxsdk-mt.lib on disk and rewrite the
          # project file's paths to match reality.
          $header = Get-ChildItem "C:\Program Files\Autodesk\FBX\FBX SDK" -Recurse -Filter "fbxsdk.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $header) {
            Get-ChildItem "C:\Program Files\Autodesk\FBX" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 100 | Format-Table FullName
            throw "fbxsdk.h not found anywhere under the FBX install root - see listing above"
          }
          $includeDir = $header.DirectoryName
          Write-Host "Found fbxsdk.h include dir: $includeDir"

          $libs = Get-ChildItem "C:\Program Files\Autodesk\FBX\FBX SDK" -Recurse -Filter "libfbxsdk-mt.lib" -ErrorAction SilentlyContinue
          if (-not $libs) {
            throw "libfbxsdk-mt.lib not found anywhere under the FBX install root"
          }
          foreach ($lib in $libs) {
            Write-Host "Found lib dir: $($lib.DirectoryName)"
          }

          $vcxproj = "AssetStudioFBXNative\AssetStudioFBXNative.vcxproj"
          $content = Get-Content $vcxproj -Raw

          # Replace the hardcoded include dir (every occurrence, regardless of the version
          # baked into the checked-in file) with the real one we just found.
          $content = $content.Replace('C:\Program Files\Autodesk\FBX\FBX SDK\2020.3.10\include', $includeDir)

          # Replace each of the four lib dirs (x86/x64 x debug/release) with the matching
          # real directory found on disk, matched by trailing path segment.
          foreach ($config in @(
            @{ Old = 'C:\Program Files\Autodesk\FBX\FBX SDK\2020.3.10\lib\x86\debug';   Suffix = 'x86\debug'   },
            @{ Old = 'C:\Program Files\Autodesk\FBX\FBX SDK\2020.3.10\lib\x86\release'; Suffix = 'x86\release' },
            @{ Old = 'C:\Program Files\Autodesk\FBX\FBX SDK\2020.3.10\lib\x64\debug';   Suffix = 'x64\debug'   },
            @{ Old = 'C:\Program Files\Autodesk\FBX\FBX SDK\2020.3.10\lib\x64\release'; Suffix = 'x64\release' }
          )) {
            $match = $libs | Where-Object { $_.DirectoryName -like "*$($config.Suffix)" } | Select-Object -First 1
            if (-not $match) {
              throw "Could not find an installed lib directory matching '*$($config.Suffix)' - installed layout may differ from what this script expects"
            }
            $content = $content.Replace($config.Old, $match.DirectoryName)
            Write-Host "Mapped $($config.Old) -> $($match.DirectoryName)"
          }

          Set-Content -Path $vcxproj -Value $content -NoNewline
          Write-Host "Patched $vcxproj to use the installed FBX SDK paths."

      - name: Nuget Restore
        run: nuget restore

      - name: Build .Net472
        run: msbuild /p:Configuration=Release /p:TargetFramework=net472 /verbosity:minimal

      - name: Build .Net5
        run: msbuild /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net5.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .Net6
        run: msbuild /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net6.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Upload .Net472 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net472
          path: AssetStudioGUI/bin/Release/net472

      - name: Upload .Net5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net5
          path: AssetStudioGUI/bin/Release/net5.0-windows/publish

      - name: Upload .Net6 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net6
          path: AssetStudioGUI/bin/Release/net6.0-windows/publish
