name: AssetStudioBuild

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download and install FBX SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          md fbx | Out-Null
          cd fbx

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          $p = Start-Process -FilePath ".\fbxsdk.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "FBX SDK installer exited with code $($p.ExitCode)"
          }

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          $p = Start-Process -FilePath ".\fbxpdb.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "FBX SDK pdb installer exited with code $($p.ExitCode)"
          }
          cd ..

          # The installer writes to a versioned path under Program Files but does not
          # make that path visible to this (already-running) runner process, so we
          # have to locate it and export it ourselves for later steps.
          $fbxRoot = Get-ChildItem "C:\Program Files\Autodesk\FBX\FBX SDK" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName

          if (-not $fbxRoot -or -not (Test-Path (Join-Path $fbxRoot "include\fbxsdk.h"))) {
            Write-Host "FBX SDK install root: $fbxRoot"
            Get-ChildItem "C:\Program Files\Autodesk\FBX" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50 | Format-Table FullName
            throw "fbxsdk.h not found after install - see directory listing above"
          }

          Write-Host "Found FBX SDK at $fbxRoot"
          "FBXSDK_ROOT=$fbxRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Nuget Restore
        run: nuget restore

      - name: Build .Net472
        run: msbuild /p:Configuration=Release /p:TargetFramework=net472 /p:FBXSDK_ROOT="$env:FBXSDK_ROOT" /verbosity:minimal

      - name: Build .Net5
        run: msbuild /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net5.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Build .Net6
        run: msbuild /t:AssetStudioGUI:publish /p:Configuration=Release /p:TargetFramework=net6.0-windows /p:SelfContained=false /verbosity:minimal

      - name: Upload .Net472 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net472
          path: AssetStudioGUI/bin/Release/net472

      - name: Upload .Net5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net5
          path: AssetStudioGUI/bin/Release/net5.0-windows/publish

      - name: Upload .Net6 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.net6
          path: AssetStudioGUI/bin/Release/net6.0-windows/publish
